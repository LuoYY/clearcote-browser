<!doctype html>
<!--
  A press-and-hold verification button, for the press_and_hold tests and the docs example. It behaves
  like the hold-to-verify buttons sites put in front of a page:

    * only a TRUSTED primary-button press starts it (a synthetic dispatchEvent / el.click() is rejected);
    * the bar fills while the button stays down, over a hold time the page does not show
      (4-7 s, drawn per load; ?ms=N fixes it for a test);
    * letting go early, sliding off the button, or the window losing focus resets the bar: try again;
    * once full it locks into the done state: #hold gets data-state="done" and #status reads "Verified".

  window.__hold reports what happened: state, attempts, the required and achieved hold, the pointer
  moves seen while held (and how many reported no button), and rejected presses. No network, no deps.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Press and hold</title>
<style>
  :root { --ink:#1d2433; --muted:#6b7385; --line:#d7dbe3; --fill:#1d2433; --ok:#1f8a4c; --bg:#f6f7f9; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { position:absolute; left:50%; top:110px; transform:translateX(-50%); width:360px; padding:28px 28px 22px;
    background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 24px rgba(20,30,50,.08);
    text-align:center; }
  h1 { font-size:18px; margin:0 0 6px; }
  p { margin:0 0 20px; color:var(--muted); }
  #hold { position:relative; width:260px; height:56px; margin:0 auto; border:2px solid var(--fill);
    border-radius:28px; background:#fff; color:var(--ink); font:600 15px/1 inherit; cursor:pointer; overflow:hidden;
    user-select:none; -webkit-user-select:none; touch-action:none; }
  #hold .bar { position:absolute; inset:0 auto 0 0; width:0; background:var(--fill); }
  #hold .label { position:relative; mix-blend-mode:difference; color:#fff; pointer-events:none; }
  #hold.rewind .bar { transition:width .35s ease-out; }
  #hold[data-state="done"] { border-color:var(--ok); cursor:default; }
  #hold[data-state="done"] .bar { width:100% !important; background:var(--ok); }
  #status { min-height:20px; margin-top:14px; font-size:13px; color:var(--muted); }
  #status.ok { color:var(--ok); font-weight:600; }
</style>
</head>
<body>
<div class="card">
  <h1>Before we continue</h1>
  <p>Press and hold the button until it fills.</p>
  <button id="hold" type="button" data-state="idle" aria-describedby="status">
    <span class="bar"></span><span class="label">Press and hold</span>
  </button>
  <div id="status" role="status" aria-live="polite"></div>
</div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const need = Number(q.get('ms')) > 0 ? Number(q.get('ms')) : 4000 + Math.random() * 3000;
  const btn = document.getElementById('hold');
  const bar = btn.querySelector('.bar');
  const label = btn.querySelector('.label');
  const status = document.getElementById('status');
  const S = window.__hold = { state: 'idle', need: Math.round(need), attempts: 0, held: 0, moves: 0,
                              movesNoButton: 0, rejected: [], resets: [] };
  let t0 = 0, raf = 0, pid = null;

  const set = (st, text, ok) => { S.state = st; btn.dataset.state = st; status.textContent = text || '';
                                  status.className = ok ? 'ok' : ''; };
  const draw = () => {
    const f = Math.min(1, (performance.now() - t0) / need);
    bar.style.width = (f * 100).toFixed(2) + '%';
    if (f >= 1) return finish();
    raf = requestAnimationFrame(draw);
  };
  const finish = () => {
    cancelAnimationFrame(raf);
    S.held = Math.round(performance.now() - t0);
    if (pid !== null) { try { btn.releasePointerCapture(pid); } catch (e) {} }
    pid = null;
    label.textContent = '✓ Verified';
    set('done', 'Verified', true);
  };
  const reset = (why) => {
    if (S.state !== 'holding') return;
    cancelAnimationFrame(raf);
    S.resets.push({ why, after: Math.round(performance.now() - t0) });
    pid = null;
    btn.classList.add('rewind');
    bar.style.width = '0';
    setTimeout(() => btn.classList.remove('rewind'), 360);
    set('idle', why === 'released' ? 'Released too early — try again.' : 'Moved off the button — try again.');
  };

  btn.addEventListener('pointerdown', (e) => {
    if (S.state !== 'idle') return;
    if (!e.isTrusted) { S.rejected.push('untrusted'); return; }
    if (e.button !== 0) { S.rejected.push('button ' + e.button); return; }
    S.attempts++;
    t0 = performance.now();
    pid = e.pointerId;
    btn.classList.remove('rewind');
    set('holding', 'Keep holding…');
    raf = requestAnimationFrame(draw);
  });
  btn.addEventListener('pointermove', (e) => {
    if (S.state !== 'holding') return;
    S.moves++;
    if (!(e.buttons & 1)) S.movesNoButton++;
  });
  btn.addEventListener('pointerup', () => reset('released'));
  btn.addEventListener('pointercancel', () => reset('cancelled'));
  btn.addEventListener('pointerleave', () => reset('left'));
  window.addEventListener('blur', () => reset('blur'));
  btn.addEventListener('click', (e) => { if (!e.isTrusted) S.rejected.push('untrusted click'); });
})();
</script>
</body>
</html>
